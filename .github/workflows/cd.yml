on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    permissions:
      contents: 'read'
      id-token: 'write' 

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: build the app
        run: ./scripts/buildprod.sh 

      - name: deploy to google
        uses: 'google-github-actions/auth@v2'
        with:
            credentials_json: '${{secrets.GCP_CREDENTIALS}}' # Replace with the name of your GitHub Actions secret

      - name: deploy
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: submit
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-508600/notely-ar-repo/notely:latest .

      - name: migrate db
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-508600/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-508600 --max-instances=4